<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Premiere Pro Full MCP</title>
  <script defer src="./main.js"></script>
  <style>
    :root { color-scheme:dark; font:12px/1.35 system-ui,sans-serif; }
    * { box-sizing:border-box; }
    html { width:100%; height:100vh; min-width:0; margin:0; background:#1e1e1e; color:#f1f1f1; }
    body { position:relative; width:100%; height:100vh; min-width:0; min-height:260px; margin:0; overflow:auto; background:#1e1e1e; color:#f1f1f1; }
    .panel { position:absolute; inset:0; display:block; width:100%; min-width:0; min-height:260px; padding:7px; overflow:auto; }
    .panel-header { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
    h1 { min-width:0; margin:0; overflow:hidden; font-size:14px; font-weight:600; line-height:1.2; text-overflow:ellipsis; white-space:nowrap; }
    .badge { flex:none; padding:2px 6px; border:1px solid #555; border-radius:999px; color:#cfcfcf; font-size:10px; }
    button { display:block; width:100%; height:28px; min-height:28px; margin:4px 0; padding:3px 8px; background:#1473e6; color:#fff; border:0; border-radius:3px; font-weight:600; }
    button:hover { background:#0d66d0; }
    button:focus { outline:2px solid #5aa9ff; outline-offset:1px; }
    #status { min-width:0; margin:4px 0; padding:4px 6px; border-left:4px solid #888; background:#292929; overflow-wrap:anywhere; white-space:pre-wrap; }
    .connected { border-left-color:#2d9d78 !important; }
    .error { border-left-color:#e34850 !important; }
    @media (max-width:240px) {
      .panel { padding:7px; }
      .badge { display:none; }
      button { height:28px; min-height:28px; }
    }
  </style>
</head>
<body>
  <div id="premiere-mcp-panel" class="panel">
    <div class="panel-header">
      <h1>Premiere Pro Full MCP</h1>
      <span class="badge">Local bridge</span>
    </div>
    <button id="connect" type="button" title="Connect to the localhost-only MCP bridge.">Connect</button>
    <div id="status" role="status" aria-live="polite">Connecting to the local bridge…</div>
  </div>
</body>
</html>
