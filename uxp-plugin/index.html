<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Premiere Pro Full MCP</title>
  <style>
    :root { color-scheme:dark; font:12px/1.35 system-ui,sans-serif; }
    * { box-sizing:border-box; }
    html, body { width:100%; min-width:0; min-height:100%; margin:0; background:#1e1e1e; color:#f1f1f1; }
    body { overflow:auto; }
    .panel { display:grid; gap:8px; width:100%; min-width:0; padding:10px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
    h1 { min-width:0; margin:0; overflow:hidden; font-size:14px; font-weight:600; line-height:1.2; text-overflow:ellipsis; white-space:nowrap; }
    .badge { flex:none; padding:2px 6px; border:1px solid #555; border-radius:999px; color:#cfcfcf; font-size:10px; }
    .field { display:grid; grid-template-columns:minmax(72px, 30%) minmax(90px, 1fr); align-items:center; gap:8px; min-width:0; }
    label { min-width:0; overflow:hidden; color:#d7d7d7; text-overflow:ellipsis; white-space:nowrap; }
    input { width:100%; min-width:0; height:30px; padding:5px 7px; background:#292929; color:#fff; border:1px solid #666; border-radius:3px; }
    button { width:100%; min-height:30px; padding:6px 10px; background:#1473e6; color:#fff; border:0; border-radius:3px; font-weight:600; }
    button:hover { background:#0d66d0; }
    button:focus, input:focus, summary:focus { outline:2px solid #5aa9ff; outline-offset:1px; }
    #status { min-width:0; padding:7px 8px; border-left:4px solid #888; background:#292929; overflow-wrap:anywhere; white-space:pre-wrap; }
    .connected { border-left-color:#2d9d78 !important; }
    .error { border-left-color:#e34850 !important; }
    details { color:#bdbdbd; font-size:11px; }
    summary { cursor:pointer; user-select:none; }
    details p { margin:6px 0 0; }
    @media (max-width:240px) {
      .panel { gap:6px; padding:7px; }
      .badge { display:none; }
      .field { grid-template-columns:1fr; gap:3px; }
      input, button { height:28px; min-height:28px; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <h1>Premiere Pro Full MCP</h1>
      <span class="badge">Local bridge</span>
    </header>
    <div class="field">
      <label for="port">Port</label>
      <input id="port" value="17777" inputmode="numeric" aria-describedby="status">
    </div>
    <div class="field">
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Loaded after pairing" aria-describedby="status">
    </div>
    <button id="pair" type="button">Pair with installed helper…</button>
    <button id="connect" type="button">Connect</button>
    <div id="status" role="status" aria-live="polite">Disconnected</div>
    <details>
      <summary>Connection details</summary>
      <p>Choose runtime-bootstrap.json from the installed helper once. Only an opaque file permission is remembered; the token is never logged or packaged.</p>
    </details>
  </main>
  <script src="main.cjs"></script>
</body>
</html>
