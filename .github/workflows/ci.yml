name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/smoke.mjs
      - shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "premiere-mcp-release"
          node scripts/build-release.mjs --out $out --allow-dirty
          $expected = @(
            "premiere-pro-full-mcp-2.0.0.tgz",
            "premiere-pro-full-mcp-2.0.0-windows.zip",
            "premiere-pro-full-mcp-2.0.0.ccx",
            "release-manifest.json"
          )
          foreach ($name in $expected) { if (-not (Test-Path (Join-Path $out $name)) { throw "Missing release artifact: $name" } }
